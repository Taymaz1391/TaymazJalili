<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت | تایماز جلیلی</title><link rel="icon" href="assets/logo.png"><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/style.css"></head><body><div id="hdr"></div><main class="w"><div class="glass blk" style="margin-top:24px"><h1>پنل مدیریت</h1><div class="tabs" id="tb"></div><div id="ad">در حال بررسی ورود…</div></div>
</main><div id="ftr"></div><script src="assets/config.js"></script><script src="assets/app.js"></script>
<script>
const tabs={stats:'آمار',orders:'سفارش‌ها',products:'محصولات',coupons:'کد تخفیف',users:'کاربران',site:'محتوای سایت',msgs:'پیام‌ها',settings:'تنظیمات'};
$('#tb').innerHTML=Object.entries(tabs).map(([k,v])=>`<button class="chip" onclick="tab('${k}')">${v}</button>`).join('');
const fl=u=>u?`<a href="${A+u}?t=${tok}" target="_blank">مشاهده</a>`:'';const q=v=>String(v??'').replace(/"/g,'&quot;');
const G=(n,a,c,k)=>Array.from({length:k},(_,i)=>`<div style="display:flex;gap:6px">${Array.from({length:c},(_,j)=>`<input id="${n}_${i}_${j}" value="${q(a?.[i]?.[j])}">`).join('')}</div>`).join('');
const GV=(n,c,k)=>Array.from({length:k},(_,i)=>Array.from({length:c},(_,j)=>$(`#${n}_${i}_${j}`).value));
let editId=0;
const V={
async stats(){const s=await api('/stats');return`<div class="stats">${[['سفارش',s.orders],['پرداخت‌شده',s.paid],['درآمد',T(s.revenue)],['کاربر',s.users],['محصول',s.products]].map(x=>`<div><b>${x[1]}</b>${x[0]}</div>`).join('')}</div>`},
async orders(){const os=await api('/orders');return`<table>${os.map(o=>`<tr><td>${o.user}<br><small>${o.items.map(i=>i.name+'×'+i.qty).join('، ')}</small></td><td>${T(o.total)}</td><td>${stl[o.status]}<br><small>${o.ai?.reason||''}</small></td><td>${fl(o.receipt)}</td><td><button class="btn s sm" onclick="ost(${o.id},'approved')">تأیید</button> <button class="btn s sm" onclick="ost(${o.id},'rejected')">رد</button> <button class="btn s sm" onclick="if(confirm('حذف شود؟'))api('/orders/${o.id}',{method:'DELETE'}).then(()=>tab('orders'))">حذف</button><br><small>فایل برای مشتری:</small> <input type="file" onchange="ofile(${o.id},this)"></td></tr>`).join('')||'<tr><td>سفارشی نیست</td></tr>'}</table>`},
async products(){await load();const e=P.find(p=>p.id==editId)||{};return`<h3>${editId?'ویرایش محصول':'محصول جدید'}</h3><input id="pn" placeholder="نام" value="${q(e.name)}"><input id="pc" placeholder="دسته" value="${q(e.cat)}"><input id="pp" type="number" placeholder="قیمت تومان" value="${e.price||''}"><textarea id="pd" placeholder="توضیح">${e.desc||''}</textarea><input id="pi" type="file" accept="image/*"><button class="btn v" onclick="savep()">${editId?'ذخیره تغییرات':'افزودن'}</button> ${editId?'<button class="btn s" onclick="editId=0;tab(\'products\')">انصراف</button>':''}<table>${P.map(p=>`<tr><td>${p.name}</td><td>${p.cat||''}</td><td>${T(p.price)}</td><td><button class="btn s sm" onclick="editId=${p.id};tab('products');scrollTo(0,0)">ویرایش</button> <button class="btn s sm" onclick="if(confirm('حذف شود؟'))api('/products/${p.id}',{method:'DELETE'}).then(()=>tab('products'))">حذف</button></td></tr>`).join('')}</table>`},
async coupons(){const c=await api('/coupons');return`<input id="kc" placeholder="کد"><input id="kp" type="number" placeholder="درصد تخفیف"><button class="btn v" onclick="api('/coupons',{method:'POST',body:{code:$('#kc').value,pct:$('#kp').value}}).then(()=>tab('coupons'))">ذخیره</button><table>${c.map(x=>`<tr><td>${x.code}</td><td>${x.pct}٪</td><td><button class="btn s sm" onclick="api('/coupons/${x.code}',{method:'DELETE'}).then(()=>tab('coupons'))">حذف</button></td></tr>`).join('')}</table>`},
async users(){const u=await api('/users');return`<table>${u.map(x=>`<tr><td>${x.username}</td><td>${x.role=='admin'?'مدیر':'کاربر'}</td><td><button class="btn s sm" onclick="np(${x.id})">رمز جدید</button> <button class="btn s sm" onclick="if(confirm('حذف شود؟'))api('/users/${x.id}',{method:'DELETE'}).then(()=>tab('users'))">حذف</button></td></tr>`).join('')}</table>`},
async site(){return`<h3>لوگو (PNG بدون پس‌زمینه)</h3><input type="file" id="lg" accept="image/*"><button class="btn s sm" onclick="upLogo()">آپلود لوگو</button>
<h3>متن‌ها و رنگ‌ها</h3><label>نام برند</label><input id="f_brand" value="${q(C.brand)}"><label>عنوان شغلی</label><input id="f_role" value="${q(C.role)}"><label>متن صفحه اصلی</label><textarea id="f_heroText">${C.heroText||''}</textarea><label>تیتر بخش درباره</label><input id="f_aboutTitle" value="${q(C.aboutTitle)}"><label>اعلان بالای سایت (خالی = پنهان)</label><input id="f_announce" value="${q(C.announce)}"><label>تلفن</label><input id="f_phone" value="${q(C.phone)}"><label>آیدی اینستاگرام (بدون @)</label><input id="f_insta" value="${q(C.insta)}"><label>آدرس</label><input id="f_address" value="${q(C.address)}">
<label>رنگ اصلی</label><input type="color" id="f_c1" value="${C.c1||'#8b6cff'}"><label>رنگ دوم</label><input type="color" id="f_c2" value="${C.c2||'#c08cff'}">
<h3>آمار (عدد، عنوان)</h3>${G('st',C.stats,2,3)}<h3>مزایا (عنوان، توضیح، رنگ)</h3>${G('sv',C.services,3,4)}<h3>امکانات (با ویرگول)</h3><input id="f_tools" value="${q((C.tools||[]).join(','))}"><h3>مراحل (عنوان، توضیح)</h3>${G('pr',C.process,2,5)}<h3>نظرات (نام، متن)</h3>${G('rv',C.reviews,2,3)}<br><button class="btn v" onclick="saveSite()">ذخیره سایت</button>`},
async msgs(){const m=await api('/messages');return`<table>${m.map(x=>`<tr><td>${x.name}</td><td>${x.text}</td><td><button class="btn s sm" onclick="api('/messages/${x.id}',{method:'DELETE'}).then(()=>tab('msgs'))">حذف</button></td></tr>`).join('')||'<tr><td>پیامی نیست</td></tr>'}</table>`},
async settings(){const s=await api('/settings');const t=await api('/stats');return`<h3>کارت و بانک</h3><input id="s1" value="${q(s.card)}"><input id="s2" value="${q(s.owner)}"><input id="s3" value="${q(s.bank)}"><label>حد اطمینان تأیید خودکار فیش (۰ تا ۱)</label><input id="s4" type="number" step="0.05" min="0" max="1" value="0.85"><button class="btn v" onclick="api('/settings',{method:'POST',body:{card:$('#s1').value,owner:$('#s2').value,bank:$('#s3').value,threshold:+$('#s4').value}}).then(()=>toast('ذخیره شد'))">ذخیره</button><h3 style="margin-top:20px">رمز خودم</h3><button class="btn s" onclick="np('me')">تغییر رمز ادمین</button>`}};
async function tab(k){$('#ad').innerHTML='…';$('#ad').innerHTML=await V[k]().catch(()=>'<p>خطا یا نیاز به دسترسی مدیر.</p>')}
async function savep(){const f=new FormData;f.append('name',$('#pn').value);f.append('cat',$('#pc').value);f.append('price',$('#pp').value);f.append('desc',$('#pd').value);if($('#pi').files[0])f.append('image',$('#pi').files[0]);await api(editId?'/products/'+editId:'/products',{method:editId?'PUT':'POST',body:f});editId=0;toast('ذخیره شد');tab('products')}
const ost=(id,status)=>api(`/orders/${id}/status`,{method:'POST',body:{status}}).then(()=>tab('orders'));
async function ofile(id,el){const f=new FormData;f.append('file',el.files[0]);await api(`/orders/${id}/file`,{method:'POST',body:f});toast('ارسال شد');tab('orders')}
async function np(id){const v=prompt('رمز جدید (حداقل ۶ کاراکتر)');if(v)await api(id=='me'?'/password':`/users/${id}/password`,{method:'POST',body:{password:v}}).then(()=>toast('رمز تغییر کرد'))}
async function upLogo(){const f=$('#lg').files[0];if(!f)return toast('فایل لوگو را انتخاب کنید');const d=new FormData;d.append('logo',f);const r=await api('/logo',{method:'POST',body:d});C.logo=r.logo;toast('لوگو عوض شد')}
async function saveSite(){const g=k=>$('#f_'+k).value;const b={brand:g('brand'),role:g('role'),heroText:g('heroText'),aboutTitle:g('aboutTitle'),announce:g('announce'),phone:g('phone'),insta:g('insta'),address:g('address'),c1:g('c1'),c2:g('c2'),logo:C.logo,stats:GV('st',2,3),services:GV('sv',3,4),tools:g('tools').split(',').map(x=>x.trim()).filter(Boolean),process:GV('pr',2,5),reviews:GV('rv',2,3)};await api('/site',{method:'POST',body:b});Object.assign(C,b);toast('سایت به‌روز شد')}
addEventListener('booted',()=>{if(me?.role=='admin'){tab('stats')}else{$('#ad').innerHTML='<p>برای ورود، نام کاربری و رمز مدیر را وارد کنید.</p>';authM()}});
</script></body></html>
